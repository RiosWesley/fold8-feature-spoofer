plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'dev.rios.fold8spoof'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.rios.fold8spoof'
        minSdk 28
        // Target 28 keeps the base untrusted_app SELinux domain so the app
        // can execute its own helper binaries (llama-server). API 34+
        // domains forbid exec of app_data_file.
        targetSdk 28
        versionCode 10
        versionName '1.9-npu'
    }

    signingConfigs {
        release {
            storeFile = file(System.getenv("KEYSTORE_FILE") ?: "missing.jks")
            storePassword = System.getenv("KEYSTORE_PASSWORD")
            keyAlias = System.getenv("KEY_ALIAS")
            keyPassword = System.getenv("KEY_PASSWORD")
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            // CI signs with the release keystore from env/secrets; local
            // builds without env fall back to the debug signature.
            if (System.getenv("KEYSTORE_FILE") != null) {
                signingConfig = signingConfigs.release
            }
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    // Sideloaded root module, not Play-distributed: targetSdk 28 is
    // intentional (SELinux domain allows native exec + background starts).
    lint {
        disable 'ExpiredTargetSdkVersion'
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
    implementation 'com.google.ai.edge.litertlm:litertlm-android:0.17.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
