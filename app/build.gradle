plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.rios.fold8spoof'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.rios.fold8spoof'
        minSdk 28
        targetSdk 35
        versionCode 7
        versionName '1.6'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
