plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.rios.fold8spoof'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.rios.fold8spoof'
        minSdk 28
        // Target 28 keeps the base untrusted_app SELinux domain so the app
        // can execute its own helper binaries (llama-server). API 34+
        // domains forbid exec of app_data_file.
        targetSdk 28
        versionCode 9
        versionName '1.8'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
